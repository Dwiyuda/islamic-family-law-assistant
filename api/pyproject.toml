[project]
name = "ifla-api"
version = "0.1.0"
description = "Islamic Family Law Assistant - API and ingestion"
requires-python = ">=3.12"
dependencies = [
  "pydantic==2.13.5",
  "pyyaml==6.0.3",
  "httpx==0.28.1",
  "pypdf==6.19.0",
  "beautifulsoup4==4.15.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.9"]
retrieval = ["rank-bm25==0.2.2", "qdrant-client==1.19.1", "numpy==2.5.3"]
models = ["FlagEmbedding==1.4.2"]
api = ["fastapi==0.142.2", "uvicorn==0.54.0"]
ragas = ["ragas==0.4.3", "langchain-community==0.3.31"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["DTZ011"]
